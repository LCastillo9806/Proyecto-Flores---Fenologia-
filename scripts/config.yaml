# Configuración del proyecto: estados fenológicos de rosa en fotos de dron
raiz: C:/Users/lab22/rosas_dataset
raw: C:/Users/lab22/rosas_dataset/raw/IMAGENES_DRONE_PROYECCION_FLOR

# Todas las fotos se llevan a este ancho para que un botón mida lo mismo en píxeles
# (las de agosto son 4000x2250 y las de septiembre 8064x6048 con el mismo campo visual).
ancho_ref: 8064

# 4 estados que se anotan UNA vez; los 3 modelos se derivan de aquí.
estados: [garbanzo, rayando_color, punto_corte, abierta]

# Partición por grupo fecha_bloque (las fotos de un mismo bloque se solapan).
particion:
  test: [02_09_26_BL18_freedom_JPEG, 02_09_26_BL19_vainilla_JPEG]
  val:  [28_08_26_BL22_vainilla_jpg, 28_08_26_BL32_Freedom_JPG]
  # el resto va a train

# Tres modelos binarios; cada clase es la unión de estados anotados.
# Los estados que no aparecen en un modelo se dejan como fondo.
modelos:
  A_rayando_vs_corte:
    rayando_color: [rayando_color]
    punto_corte:   [punto_corte]
  B_garbanzo_vs_rayando:
    garbanzo:      [garbanzo]
    rayando_color: [rayando_color]
  C_cerrado_vs_abierta:
    boton_cerrado: [garbanzo, rayando_color, punto_corte]
    flor_abierta:  [abierta]

tile: 1024
solape: 0.25

entrenamiento:
  modelo: yolo26s.pt
  imgsz: 1024
  epochs: 150
  patience: 40
  batch: 8
  seed: 0

# Ejemplos para la preanotación con YOLOE (indicaciones visuales). Fotos de TRAIN.
